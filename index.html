<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>USD-CAD Conversion Cost Comparison</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            padding: 40px;
        }
        
        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 2em;
        }
        
        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 0.95em;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
        }
        
        input[type="number"],
        select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            font-size: 16px;
            transition: border-color 0.3s;
        }
        
        input[type="number"]:focus,
        select:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .rate-note {
            font-size: 0.85em;
            color: #888;
            margin-top: 5px;
            font-style: italic;
        }
        
        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-top: 10px;
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        
        button:active {
            transform: translateY(0);
        }
        
        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        
        .loading {
            text-align: center;
            padding: 20px;
            color: #666;
        }
        
        .results {
            margin-top: 30px;
            display: none;
        }
        
        .results.show {
            display: block;
        }
        
        .comparison-card {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
            border-left: 4px solid #667eea;
        }
        
        .comparison-card.best {
            border-left-color: #10b981;
            background: #f0fdf4;
        }
        
        .comparison-card h3 {
            color: #333;
            margin-bottom: 15px;
            font-size: 1.3em;
        }
        
        .comparison-card.best h3::after {
            content: " ✓ Best Option";
            color: #10b981;
            font-size: 0.8em;
            margin-left: 10px;
        }
        
        .detail-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #e0e0e0;
        }
        
        .detail-row:last-child {
            border-bottom: none;
            font-weight: 600;
            font-size: 1.1em;
            margin-top: 10px;
            padding-top: 15px;
            border-top: 2px solid #333;
        }
        
        .detail-label {
            color: #666;
        }
        
        .detail-value {
            color: #333;
            font-weight: 500;
        }
        
        
        .error {
            background: #fee2e2;
            color: #dc2626;
            padding: 15px;
            border-radius: 6px;
            margin-top: 20px;
            border-left: 4px solid #dc2626;
        }
        
        .info-box {
            background: #eff6ff;
            border-left: 4px solid #3b82f6;
            padding: 15px;
            border-radius: 6px;
            margin-top: 20px;
            font-size: 0.9em;
            color: #1e40af;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>USD-CAD Conversion Cost Comparison</h1>
        <p class="subtitle">Compare Wealthsimple conversion fees vs Norbert's Gambit (DLR.TO)</p>
        
        <form id="conversionForm">
            <div class="form-group">
                <label for="amount">Amount to Convert</label>
                <input type="number" id="amount" step="0.01" min="0" placeholder="Enter amount" required>
            </div>
            
            <div class="form-group">
                <label for="direction">Conversion Direction</label>
                <select id="direction">
                    <option value="usdToCad">USD → CAD</option>
                    <option value="cadToUsd">CAD → USD</option>
                </select>
            </div>
            
            <div class="form-group">
                <label for="wsRate">Wealthsimple Conversion Rate</label>
                <input type="number" id="wsRate" step="0.0001" placeholder="Leave blank to use market rate">
                <p class="rate-note">Go to Wealthsimple exchange page (before confirming) to see the current rate. If left blank, we'll use the current market rate.</p>
            </div>
            
            <button type="submit" id="calculateBtn">Calculate & Compare</button>
        </form>
        
        <div id="loading" class="loading" style="display: none;">
            Fetching current rates and spread data...
        </div>
        
        <div id="results" class="results"></div>
    </div>
    
    <script>
        // Free exchange rate API (no key required for basic usage)
        const EXCHANGE_RATE_API = 'https://api.exchangerate-api.com/v4/latest/USD';
        
        // Alpha Vantage API for DLR.TO price
        const ALPHA_VANTAGE_API_KEY = 'GSSH8SFKU7YD3F6O';
        const DLR_SYMBOL_USD_CAD = 'DLR.TO';
        const DLR_SYMBOL_CAD_USD = 'DLR-U.TO';
        const DEFAULT_DLR_SPREAD_PERCENT = 0.015; // Typical DLR spread
        
        async function fetchMarketRate() {
            const response = await fetch(EXCHANGE_RATE_API);
            if (!response.ok) {
                throw new Error('Failed to fetch market exchange rate');
            }
            const data = await response.json();
            if (!data.rates || !data.rates.CAD) {
                throw new Error('Invalid exchange rate data');
            }
            return data.rates.CAD;
        }
        
        async function fetchDLRSpread(direction) {
            const symbol = direction === 'usdToCad' ? DLR_SYMBOL_USD_CAD : DLR_SYMBOL_CAD_USD;
            const apiUrl = `https://www.alphavantage.co/query?function=GLOBAL_QUOTE&symbol=${symbol}&apikey=${ALPHA_VANTAGE_API_KEY}`;
            
            const response = await fetch(apiUrl);
            const data = await response.json();
            
            const quote = data['Global Quote'];
            const currentPrice = parseFloat(quote['05. price']);
            
            const spreadPercent = DEFAULT_DLR_SPREAD_PERCENT;
            const bid = currentPrice * (1 - spreadPercent / 200);
            const ask = currentPrice * (1 + spreadPercent / 200);
            
            return {
                symbol: symbol,
                price: currentPrice,
                spreadPercent: spreadPercent,
                bid: bid,
                ask: ask
            };
        }
        
        function calculateWealthsimpleFee(amount, direction) {
            // CAD to USD is always 1.5%
            if (direction === 'cadToUsd') {
                return 0.015;
            }
            
            // USD to CAD uses tiered fees
            if (amount >= 100000) {
                return 0; // 0% fee, entire amount
            } else if (amount >= 25000) {
                return 0.005; // 0.50%
            } else if (amount >= 10000) {
                return 0.01; // 1.00%
            } else {
                return 0.015; // 1.50%
            }
        }
        
        function formatCurrency(amount, currency) {
            return new Intl.NumberFormat('en-CA', {
                style: 'currency',
                currency: currency,
                minimumFractionDigits: 2,
                maximumFractionDigits: 2
            }).format(amount);
        }
        
        function formatPercent(value) {
            return (value * 100).toFixed(3) + '%';
        }
        
        async function calculate() {
            const amount = parseFloat(document.getElementById('amount').value);
            const direction = document.getElementById('direction').value;
            const wsRateInput = document.getElementById('wsRate').value;
            
            if (!amount || amount <= 0) {
                alert('Please enter a valid amount');
                return;
            }
            
            // Show loading
            document.getElementById('loading').style.display = 'block';
            document.getElementById('results').classList.remove('show');
            document.getElementById('calculateBtn').disabled = true;
            
            try {
                // Fetch market data
                const [marketRate, dlrData] = await Promise.all([
                    fetchMarketRate(),
                    fetchDLRSpread(direction)
                ]);
                
                const exchangeRate = wsRateInput ? parseFloat(wsRateInput) : marketRate;
                
                if (!exchangeRate || exchangeRate <= 0) {
                    throw new Error('Invalid exchange rate');
                }
                
                // Calculate Wealthsimple conversion
                const wsFeePercent = calculateWealthsimpleFee(amount, direction);
                const wsFee = amount * wsFeePercent;
                
                let wsAmountAfterFee, wsFinalAmount, wsCost;
                if (direction === 'usdToCad') {
                    wsAmountAfterFee = amount - wsFee;
                    wsFinalAmount = wsAmountAfterFee * exchangeRate;
                    wsCost = wsFee;
                } else {
                    wsAmountAfterFee = amount - wsFee;
                    wsFinalAmount = wsAmountAfterFee / exchangeRate;
                    wsCost = wsFee;
                }
                
                // Calculate Norbert's Gambit cost
                // Cost is the spread on DLR.TO
                // For buying and selling, you pay the spread once (buy at ask, sell at bid)
                const dlrSpreadCost = amount * (dlrData.spreadPercent / 100);
                
                let ngFinalAmount, ngCost;
                if (direction === 'usdToCad') {
                    // Using market rate for NG (no Wealthsimple markup)
                    ngFinalAmount = (amount * marketRate) - dlrSpreadCost;
                    ngCost = dlrSpreadCost;
                } else {
                    ngFinalAmount = (amount / marketRate) - dlrSpreadCost;
                    ngCost = dlrSpreadCost;
                }
                
                // Determine which is better (higher final amount is better)
                const ngBetter = ngFinalAmount > wsFinalAmount;
                
                // Display results
                const resultsDiv = document.getElementById('results');
                const sourceCurrency = direction === 'usdToCad' ? 'USD' : 'CAD';
                const targetCurrency = direction === 'usdToCad' ? 'CAD' : 'USD';
                
                resultsDiv.innerHTML = `
                    <div class="comparison-card ${ngBetter ? '' : 'best'}">
                        <h3>Wealthsimple Conversion</h3>
                        <div class="detail-row">
                            <span class="detail-label">Fee Rate:</span>
                            <span class="detail-value">${formatPercent(wsFeePercent)}</span>
                        </div>
                        <div class="detail-row">
                            <span class="detail-label">Fee Amount:</span>
                            <span class="detail-value">${formatCurrency(wsCost, sourceCurrency)}</span>
                        </div>
                        <div class="detail-row">
                            <span class="detail-label">Exchange Rate Used:</span>
                            <span class="detail-value">${exchangeRate.toFixed(4)}</span>
                        </div>
                        <div class="detail-row">
                            <span class="detail-label">Final Amount:</span>
                            <span class="detail-value">${formatCurrency(wsFinalAmount, targetCurrency)}</span>
                        </div>
                    </div>
                    
                    <div class="comparison-card ${ngBetter ? 'best' : ''}">
                        <h3>Norbert's Gambit (${dlrData.symbol})</h3>
                        <div class="detail-row">
                            <span class="detail-label">${dlrData.symbol} Current Price:</span>
                            <span class="detail-value">${formatCurrency(dlrData.price, 'CAD')}</span>
                        </div>
                        <div class="detail-row">
                            <span class="detail-label">Bid Price:</span>
                            <span class="detail-value">${formatCurrency(dlrData.bid, 'CAD')}</span>
                        </div>
                        <div class="detail-row">
                            <span class="detail-label">Ask Price:</span>
                            <span class="detail-value">${formatCurrency(dlrData.ask, 'CAD')}</span>
                        </div>
                        <div class="detail-row">
                            <span class="detail-label">Spread:</span>
                            <span class="detail-value">${formatPercent(dlrData.spreadPercent / 100)}</span>
                        </div>
                        <div class="detail-row">
                            <span class="detail-label">Spread Cost:</span>
                            <span class="detail-value">${formatCurrency(ngCost, sourceCurrency)}</span>
                        </div>
                        <div class="detail-row">
                            <span class="detail-label">Exchange Rate Used:</span>
                            <span class="detail-value">${marketRate.toFixed(4)} (market rate)</span>
                        </div>
                        <div class="detail-row">
                            <span class="detail-label">Final Amount:</span>
                            <span class="detail-value">${formatCurrency(ngFinalAmount, targetCurrency)}</span>
                        </div>
                    </div>
                    
                    <div class="info-box">
                        <strong>Note:</strong> These calculations are estimates. Actual results may vary based on:
                        <ul style="margin-top: 10px; margin-left: 20px;">
                            <li>Real-time market conditions</li>
                            <li>Actual DLR.TO spread at time of trade</li>
                            <li>Wealthsimple's exact conversion rate</li>
                        </ul>
                    </div>
                `;
                
                resultsDiv.classList.add('show');
            } catch (error) {
                document.getElementById('results').innerHTML = `
                    <div class="error">
                        <strong>Error:</strong> ${error.message || 'Failed to fetch market data. Please try again.'}
                    </div>
                `;
                document.getElementById('results').classList.add('show');
            } finally {
                document.getElementById('loading').style.display = 'none';
                document.getElementById('calculateBtn').disabled = false;
            }
        }
        
        document.getElementById('conversionForm').addEventListener('submit', (e) => {
            e.preventDefault();
            calculate();
        });
    </script>
</body>
</html>
